<svg width="1200" height="230" viewBox="0 0 1200 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="loopBg" x1="0" y1="0" x2="1200" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="1" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="signal" x1="70" y1="105" x2="1130" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="0.48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="smallGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#94A3B8" stroke-opacity="0.045"/>
    </pattern>
    <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="228" rx="22" fill="url(#loopBg)" stroke="#1E293B" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="228" rx="22" fill="url(#smallGrid)"/>

  <text x="55" y="42" fill="#64748B" font-family="Fira Code,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="2">PRODUCT LOOP / HUMAN-CONTROLLED AI</text>
  <circle cx="1140" cy="38" r="4" fill="#10B981">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="1127" y="42" fill="#475569" font-family="Fira Code,Consolas,monospace" font-size="10" text-anchor="end">LIVE</text>

  <path d="M130 112H1070" stroke="url(#signal)" stroke-opacity="0.38" stroke-width="2" stroke-dasharray="8 9">
    <animate attributeName="stroke-dashoffset" values="0;-68" dur="5s" repeatCount="indefinite"/>
  </path>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(125 112)">
      <rect x="-70" y="-38" width="140" height="76" rx="14" fill="#0F172A" stroke="#10B981" stroke-opacity="0.55"/>
      <circle cy="-12" r="7" fill="#10B981" filter="url(#nodeGlow)"/>
      <text y="18" fill="#D1FAE5" font-size="13" font-weight="800" letter-spacing="1.5">PROBLEM</text>
      <text y="34" fill="#64748B" font-size="9">real need</text>
    </g>
    <g transform="translate(315 112)">
      <rect x="-70" y="-38" width="140" height="76" rx="14" fill="#0F172A" stroke="#14B8A6" stroke-opacity="0.55"/>
      <circle cy="-12" r="7" fill="#14B8A6" filter="url(#nodeGlow)"/>
      <text y="18" fill="#CCFBF1" font-size="13" font-weight="800" letter-spacing="1.5">DATA</text>
      <text y="34" fill="#64748B" font-size="9">evidence first</text>
    </g>
    <g transform="translate(505 112)">
      <rect x="-70" y="-38" width="140" height="76" rx="14" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.55"/>
      <circle cy="-12" r="7" fill="#22D3EE" filter="url(#nodeGlow)"/>
      <text y="18" fill="#CFFAFE" font-size="13" font-weight="800" letter-spacing="1.5">MODEL</text>
      <text y="34" fill="#64748B" font-size="9">evaluate honestly</text>
    </g>
    <g transform="translate(695 112)">
      <rect x="-70" y="-38" width="140" height="76" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.55"/>
      <circle cy="-12" r="7" fill="#38BDF8" filter="url(#nodeGlow)"/>
      <text y="18" fill="#E0F2FE" font-size="13" font-weight="800" letter-spacing="1.5">API</text>
      <text y="34" fill="#64748B" font-size="9">reliable contract</text>
    </g>
    <g transform="translate(885 112)">
      <rect x="-70" y="-38" width="140" height="76" rx="14" fill="#0F172A" stroke="#A78BFA" stroke-opacity="0.55"/>
      <circle cy="-12" r="7" fill="#A78BFA" filter="url(#nodeGlow)"/>
      <text y="18" fill="#EDE9FE" font-size="13" font-weight="800" letter-spacing="1.5">PRODUCT</text>
      <text y="34" fill="#64748B" font-size="9">human in control</text>
    </g>
    <g transform="translate(1075 112)">
      <rect x="-70" y="-38" width="140" height="76" rx="14" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.55"/>
      <circle cy="-12" r="7" fill="#F59E0B" filter="url(#nodeGlow)"/>
      <text y="18" fill="#FEF3C7" font-size="13" font-weight="800" letter-spacing="1.5">DEPLOY</text>
      <text y="34" fill="#64748B" font-size="9">measure &amp; improve</text>
    </g>
  </g>

  <g fill="#475569">
    <path d="M207 107L217 112L207 117V107Z"/>
    <path d="M397 107L407 112L397 117V107Z"/>
    <path d="M587 107L597 112L587 117V107Z"/>
    <path d="M777 107L787 112L777 117V107Z"/>
    <path d="M967 107L977 112L967 117V107Z"/>
  </g>

  <path d="M1075 166C1020 208 235 208 125 166" stroke="#10B981" stroke-opacity="0.22" stroke-dasharray="4 8"/>
  <path d="M132 171L125 166L126 176" stroke="#10B981" stroke-opacity="0.45"/>
  <text x="600" y="205" fill="#475569" font-family="Fira Code,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="2" text-anchor="middle">FEEDBACK  •  VALIDATION  •  ITERATION  •  PROOF</text>
